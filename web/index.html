<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RPG Sheet — fichas, campanhas e sessões de RPG.">
  <meta name="theme-color" content="#070C14">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-title" content="RPG Sheet">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
  <title>RPG Sheet</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#070C14}
    #rpg-splash{position:fixed;inset:0;z-index:99998;display:flex;align-items:center;justify-content:center;background:#070C14;color:#f4f1f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:opacity .22s ease}
    #rpg-splash.hide{opacity:0;pointer-events:none}
    .rpg-splash-box{text-align:center;padding:24px}
    .rpg-splash-icon{width:68px;height:68px;margin:0 auto 18px;border-radius:20px;overflow:hidden;box-shadow:0 12px 34px #0006}
    .rpg-splash-title{font-size:24px;font-weight:800;letter-spacing:.2px}
    .rpg-splash-status{margin-top:8px;color:#aaa4b2;font-size:14px}
    .rpg-loader{width:34px;height:34px;margin:22px auto 0;border:3px solid #302d35;border-top-color:#aaa0c4;border-radius:50%;animation:rpg-spin .8s linear infinite}
    @keyframes rpg-spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="rpg-splash" role="status" aria-live="polite">
    <div class="rpg-splash-box">
      <div class="rpg-splash-icon"><img src="icons/Icon-192.png" alt="" width="68" height="68"></div>
      <div class="rpg-splash-title">RPG Sheet</div>
      <div class="rpg-splash-status" id="rpg-splash-status">Carregando suas aventuras…</div>
      <div class="rpg-loader"></div>
    </div>
  </div>
  <script>
    window.rpgHideSplash=()=>{
      const el=document.getElementById('rpg-splash');
      if(!el)return;
      el.classList.add('hide');
      setTimeout(()=>el.remove(),260);
    };
    window.addEventListener('flutter-first-frame',()=>window.rpgHideSplash(),{once:true});
    // Safety fallback: Flutter may not emit the event in every renderer/browser.
    const observer=new MutationObserver(()=>{
      if(document.querySelector('flutter-view,flt-glass-pane')){requestAnimationFrame(()=>requestAnimationFrame(()=>window.rpgHideSplash()));observer.disconnect();}
    });
    observer.observe(document.documentElement,{childList:true,subtree:true});
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Keep startup independent from update checks. Never reload the page from
    // service-worker lifecycle events: this avoids update/reload loops on Safari/PWA.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg=await navigator.serviceWorker.register('/rpg_service_worker.js',{updateViaCache:'none'});
          // One lightweight check per launch. A new worker is activated silently and
          // becomes effective on the next natural page/app launch.
          reg.update().catch(()=>{});
        } catch (_) {
          // Offline/temporary Safari failures must not block Flutter startup.
        }
      }, {once:true});
    }
  </script>
  <script>
    // Manual update: called ONLY when the user taps "Atualizar" in the app.
    // Checks for a new service worker, waits for it to activate (at most 5 s)
    // and reloads the page exactly once. Never called by worker events.
    window.rpgApplyUpdate = async () => {
      try {
        const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
        if (reg) {
          try { await reg.update(); } catch (_) {}
          const worker = reg.installing || reg.waiting;
          if (worker && worker.state !== 'activated') {
            await new Promise(resolve => {
              const timer = setTimeout(resolve, 5000);
              worker.addEventListener('statechange', () => {
                if (worker.state === 'activated' || worker.state === 'redundant') {
                  clearTimeout(timer);
                  resolve();
                }
              });
            });
          }
        }
      } catch (_) {
        // Any failure still ends in a single reload.
      }
      window.location.reload();
    };
  </script>
</body>
</html>
