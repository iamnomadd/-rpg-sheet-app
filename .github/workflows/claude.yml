name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            Review this pull request as an independent code auditor.
            Follow CLAUDE.md strictly.
            Do not modify files, create commits, push changes, merge, or implement fixes.
            Inspect the PR diff and relevant surrounding code.
            Focus on real bugs, regressions, data/persistence risks, security, runtime/build failures,
            important performance problems, scope violations, and missing tests.
            Ignore purely stylistic preferences.
            Report findings with severity, location, impact, and recommended fix.
            End with the verdict required by CLAUDE.md.
          claude_args: |
            --max-turns 15
            --allowedTools "Read,Glob,Grep,Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
