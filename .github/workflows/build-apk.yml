name: Build APK

on:
  workflow_dispatch:

concurrency:
  group: rpg-sheet-build-apk
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Selecionar e extrair versão
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name 'rpg_sheet_app_v*.zip' | sort -V | tail -n 1)"

          test -n "$ZIP"

          echo "Usando: $ZIP"

          rm -rf .ci_app
          mkdir .ci_app

          unzip -q "$ZIP" -d .ci_app

          PUBSPEC="$(find .ci_app -maxdepth 4 -type f -name pubspec.yaml | head -n 1)"

          test -n "$PUBSPEC"

          APP_DIR="$(dirname "$PUBSPEC")"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Baixar dependências
        run: |
          cd "$APP_DIR"
          flutter pub get

      - name: Analisar código Dart e Flutter
        run: |
          cd "$APP_DIR"
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Executar testes automáticos
        shell: bash
        run: |
          cd "$APP_DIR"

          if find test -type f -name '*_test.dart' 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "Nenhum teste encontrado."
          fi

      - name: Preparar projeto Android
        run: |
          cd "$APP_DIR"

          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

          python3 tool/prepare_android_manifest.py

          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="rpgsheet"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="auth-callback"' android/app/src/main/AndroidManifest.xml

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Gerar APK release
        run: |
          cd "$APP_DIR"
          flutter build apk --release

      - name: Resumo do build
        if: always()
        run: |
          echo "### RPG Sheet" >> "$GITHUB_STEP_SUMMARY"
          echo "Validação, testes, Android/deep link e build executados." >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: rpg-sheet-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
