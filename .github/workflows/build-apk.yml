name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          ZIP=$(find . -type f -name "*.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Nenhum ZIP encontrado"
            exit 1
          fi
          echo "ZIP encontrado: $ZIP"
          unzip -q "$ZIP" -d projeto_extraido

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Localizar projeto
        run: |
          PROJECT=$(find . -type f -name "pubspec.yaml" -not -path "./.git/*" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "pubspec.yaml não encontrado"
            exit 1
          fi
          echo "Projeto encontrado: $PROJECT"

      - name: Criar estrutura Android
        run: |
          PROJECT=$(find . -type f -name "pubspec.yaml" -not -path "./.git/*" -print -quit)
          cd "$(dirname "$PROJECT")"
          flutter create --platforms=android .

      - name: Instalar dependencias
        run: |
          PROJECT=$(find . -type f -name "pubspec.yaml" -not -path "./.git/*" -print -quit)
          cd "$(dirname "$PROJECT")"
          flutter pub get

      - name: Gerar APK
        run: |
          PROJECT=$(find . -type f -name "pubspec.yaml" -not -path "./.git/*" -print -quit)
          cd "$(dirname "$PROJECT")"
          flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: rpg-sheet-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
