name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Encontrar versão mais recente
        id: latest
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'rpg_sheet_app_v*.zip' \
            | sort -V \
            | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "Nenhum arquivo rpg_sheet_app_v*.zip encontrado."
            exit 1
          fi

          echo "Versão selecionada: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extrair projeto
        shell: bash
        run: |
          mkdir -p app
          unzip -q "${{ steps.latest.outputs.zip }}" -d app

          PUBSPEC=$(find app -type f -name pubspec.yaml | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android .

      - name: Instalar dependências
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Gerar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: rpg-sheet-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
