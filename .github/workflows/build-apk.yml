name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: flutter --version

      - name: Encontrar projeto
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f "rpg_sheet_app/pubspec.yaml" ]; then
            echo "PROJECT_DIR=rpg_sheet_app" >> $GITHUB_ENV
          else
            echo "Projeto Flutter não encontrado"
            exit 1
          fi

      - name: Instalar dependências
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Gerar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: rpg-sheet-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
