name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'rpg_sheet_app_v*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Select latest source ZIP
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name 'rpg_sheet_app_v*.zip' | sort -V | tail -n 1)"
          test -n "$ZIP"
          echo "APP_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using $ZIP"

      - name: Extract source
        shell: bash
        run: unzip -o "$APP_ZIP" -d .

      - name: Dependencies
        run: flutter pub get

      - name: Create Android project if needed
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android
          fi

      - name: Restore permanent signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/rpg-sheet-release.jks
          echo "ANDROID_KEYSTORE_PATH=rpg-sheet-release.jks" >> "$GITHUB_ENV"

      - name: Prepare Android manifest and release signing
        run: python3 tool/prepare_android_manifest.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build signed release APK
        shell: bash
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rpg-sheet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
