name: Validate v1.3.27 Pirate Sprites

on:
  push:
    branches:
      - staging-v1.3.27-approved-pirate-sprites
    paths:
      - scripts/apply_v1327_pirate_sprite.py
      - .github/workflows/validate-v1327-pirate.yml
      - lib/widgets/pirate_sprite.dart

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.3.27
        run: python3 scripts/apply_v1327_pirate_sprite.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/character/character_screen.dart lib/widgets/pirate_sprite.dart lib/core/app_version.dart pubspec.yaml web/rpg_service_worker.js PIRATE_SPRITE_CHECKLIST.md RELEASE_NOTES_1.3.27.md
          git commit -m "feat: approved pirate pixel sprites v1.3.27"
          git push origin HEAD:staging-v1.3.27-approved-pirate-sprites
