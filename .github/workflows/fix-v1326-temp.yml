name: Validate v1.3.26 analyzer fix

on:
  push:
    branches:
      - fix-v1.3.26-analyze
    paths:
      - scripts/fix_v1326_analyze.py
      - .github/workflows/fix-v1326-temp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply syntax fix
        run: python3 scripts/fix_v1326_analyze.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/character/character_screen.dart
          git commit -m "fix: correct pirate skeleton syntax v1.3.26"
          git push origin HEAD:fix-v1.3.26-analyze
