name: Apply v1.3.33 Pirate Art

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1333-pirate-art.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved pirate sprites
        run: |
          git cat-file blob 43da7fcf39deb9298f1d2bf03832c6fb7f5a79d2 > assets/character2d/pirate_normal.webp
          git cat-file blob 608740b383c557c45ec3a9edd5f8a69e6efba15e > assets/character2d/pirate_critical.webp
          git cat-file blob 83dc783aaeae877490690fa4a9831e06cd31ee6e > assets/character2d/pirate_critical_new.webp
          git cat-file blob 75008782ba0a02cf6c58306f0acf8ad7f3dba9a6 > assets/character2d/pirate_incapacitated.webp
          sed -i 's/version: 1.3.32+132/version: 1.3.33+133/' pubspec.yaml
          sed -i "s/appVersion = '1.3.32'/appVersion = '1.3.33'/; s/appBuildNumber = 132/appBuildNumber = 133/" lib/core/app_version.dart
          sed -i 's/"version": "1.3.32"/"version": "1.3.33"/; s/"build": 132/"build": 133/; s/"fullVersion": "1.3.32+132"/"fullVersion": "1.3.33+133"/' web/version.json
          sed -i "s/1.3.32+132/1.3.33+133/" web/rpg_service_worker.js
          rm -f .github/workflows/apply-v1333-pirate-art.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refresh pirate character sprites v1.3.33"
          git push origin HEAD:main
