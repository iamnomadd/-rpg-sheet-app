name: Build and Deploy RPG Sheet to Cloudflare Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.3.17 spell icon migration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_spell_icons_v1317.py
          python3 scripts/fix_v1317_spell_item.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib pubspec.yaml web README.md RELEASE_NOTES_1.3.17.md

          if git diff --cached --quiet; then
            echo "Source already migrated."
          else
            git commit -m "fix: automatic spell icons v1.3.17"
            git push origin HEAD:main
          fi

      - name: Verify Flutter project
        shell: bash
        run: |
          test -f "$GITHUB_WORKSPACE/pubspec.yaml" || { echo "pubspec.yaml not found at repository root"; exit 1; }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Flutter Web
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-sheet-web
          path: build/web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=rpg-sheet-test --branch=main
