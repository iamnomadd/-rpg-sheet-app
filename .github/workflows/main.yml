name: Build and Deploy RPG Sheet to Cloudflare Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Flutter project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Flutter project found at repository root."
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'rpg_sheet_app_v*.zip' -printf '%f\n' | sort -V | tail -n 1)"

            if [ -z "$ZIP_FILE" ]; then
              echo "No Flutter project or rpg_sheet_app_v*.zip package was found."
              exit 1
            fi

            echo "Using package: $ZIP_FILE"
            EXTRACT_DIR="$RUNNER_TEMP/rpg-sheet-source"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$GITHUB_WORKSPACE/$ZIP_FILE" -d "$EXTRACT_DIR"

            PUBSPEC="$(find "$EXTRACT_DIR" -type f -name pubspec.yaml -print -quit)"
            if [ -z "$PUBSPEC" ]; then
              echo "pubspec.yaml was not found inside $ZIP_FILE."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
            echo "Flutter project extracted to: $PROJECT_DIR"
          fi

          echo "FLUTTER_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
        run: flutter test

      - name: Build Flutter Web
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Prepare Cloudflare artifact
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/cloudflare-dist"
          cp -R "${{ env.FLUTTER_PROJECT_DIR }}/build/web" "$GITHUB_WORKSPACE/cloudflare-dist"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-sheet-web
          path: cloudflare-dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-dist --project-name=rpg-sheet-test --branch=main
