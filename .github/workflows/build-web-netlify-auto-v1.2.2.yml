name: Build and Deploy RPG Sheet Web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rpg_sheet_app_v*.zip'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract latest RPG Sheet source
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -name 'rpg_sheet_app_v*.zip' -printf '%f\n' | sort -V | tail -1)
          test -n "$ZIP" || { echo "No RPG Sheet source ZIP found"; exit 1; }
          mkdir app
          unzip -q "$ZIP" -d app
      - name: Dependencies and checks
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build Web
        working-directory: app
        run: flutter build web --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-sheet-web
          path: app/build/web
      - name: Deploy to Netlify production
        working-directory: app
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "Missing NETLIFY_AUTH_TOKEN secret"; exit 1; }
          test -n "$NETLIFY_SITE_ID" || { echo "Missing NETLIFY_SITE_ID secret"; exit 1; }
          npx --yes netlify-cli deploy --dir=build/web --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
