name: Fix v1.3.26 syntax

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-v1326-syntax.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix pirate painter ternary syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/character/character_screen.dart')
          s = p.read_text()
          old = "tilt:critical?.13:0"
          new = "tilt: critical ? .13 : 0"
          if old not in s:
              raise SystemExit('Expected syntax pattern not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/character/character_screen.dart
          git commit -m "fix: correct pirate critical pose syntax"
          git push origin HEAD:main
