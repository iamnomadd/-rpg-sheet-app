name: Supabase Keepalive

# Mantém o projeto do Supabase (plano Free) ativo com uma leitura leve diária,
# evitando a pausa por inatividade. Somente leitura: não escreve nada.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set +x
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Erro: os secrets SUPABASE_URL e/ou SUPABASE_ANON_KEY não estão configurados no repositório."
            exit 1
          fi

          # A chave vai num arquivo de cabeçalhos (não na linha de comando);
          # a saída do curl (corpo e erros) é descartada para não expor URL nem chave.
          headers_file="$(mktemp)"
          trap 'rm -f "$headers_file"' EXIT
          printf 'apikey: %s\nAuthorization: Bearer %s\n' "$SUPABASE_ANON_KEY" "$SUPABASE_ANON_KEY" > "$headers_file"

          curl_exit=0
          code="$(curl --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --header "@${headers_file}" \
            --output /dev/null --write-out '%{http_code}' \
            "${SUPABASE_URL%/}/rest/v1/rpg_shared_characters?select=*&limit=1" 2>/dev/null)" || curl_exit=$?

          echo "Código HTTP: ${code:-000}"
          if [ "$curl_exit" -ne 0 ]; then
            echo "Falha na requisição (curl saiu com código ${curl_exit})."
            exit 1
          fi
          case "$code" in
            2??|3??) echo "Supabase respondeu: OK." ;;
            *) echo "Supabase respondeu com código inesperado."; exit 1 ;;
          esac
