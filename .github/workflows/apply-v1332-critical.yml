name: Apply v1.3.32 Critical Sprites

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1332-critical.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.3.32 changes
        run: python3 scripts/apply_critical_sprites_v1332.py

      - name: Remove temporary integration helpers
        run: |
          rm -f scripts/apply_critical_sprites_v1332.py
          rm -f .github/workflows/apply-v1332-critical.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add critical character state v1.3.32"
          git push origin HEAD:main
