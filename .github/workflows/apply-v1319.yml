name: Apply RPG Sheet v1.3.19

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_theme_refinement_v1319.py
      - .github/workflows/apply-v1319.yml

permissions:
  contents: write

jobs:
  apply-v1319:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.3.19 theme changes
        run: python3 scripts/apply_theme_refinement_v1319.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Commit v1.3.19
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cyberpunk lib/app/theme.dart lib/app/app.dart lib/screens/character/character_screen.dart lib/core/app_version.dart pubspec.yaml web/rpg_service_worker.js README.md RELEASE_NOTES_1.3.19.md
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "feat: refine vampire arcane cyberpunk and pirate themes v1.3.19"
            git push origin HEAD:main
          fi
