name: Apply RPG Sheet v1.3.22 temp

on:
  push:
    branches:
      - v1-3-22-design-system
    paths:
      - scripts/apply_design_system_v1322.py
      - .github/workflows/apply-v1322-temp.yml

permissions:
  contents: write

jobs:
  apply-v1322:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.3.22 changes
        run: python3 scripts/apply_design_system_v1322.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Commit v1.3.22 to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app/theme.dart lib/app/app.dart lib/screens/character/character_screen.dart lib/screens/settings/settings_screen.dart lib/core/app_version.dart pubspec.yaml web/rpg_service_worker.js RELEASE_NOTES_1.3.22.md
          git commit -m "feat: unify card spacing and density v1.3.22"
          git push origin HEAD:v1-3-22-design-system
