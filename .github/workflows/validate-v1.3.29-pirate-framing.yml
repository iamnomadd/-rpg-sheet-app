name: Validate v1.3.29 Pirate Framing

on:
  push:
    branches:
      - staging-v1.3.29-pirate-framing
    paths:
      - scripts/apply_v1_3_29_pirate_framing.py
      - .github/workflows/validate-v1.3.29-pirate-framing.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped pirate framing fix
        run: python3 scripts/apply_v1_3_29_pirate_framing.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Commit validated scoped changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/character/character_screen.dart pubspec.yaml lib/core/app_version.dart web/rpg_service_worker.js web/version.json
          git commit -m "fix: pirate character framing v1.3.29"
          git push origin HEAD:staging-v1.3.29-pirate-framing
