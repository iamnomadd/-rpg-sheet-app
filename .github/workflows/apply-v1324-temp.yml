name: Apply RPG Sheet v1.3.24 temp

on:
  push:
    branches:
      - v1-3-24-ui-polish
    paths:
      - scripts/apply_ui_polish_v1324.py
      - .github/workflows/apply-v1324-temp.yml

permissions:
  contents: write

jobs:
  apply-v1324:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.3.24 changes
        run: python3 scripts/apply_ui_polish_v1324.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Commit v1.3.24 to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/character/character_screen.dart lib/screens/campaigns/npc_sheet_screen.dart lib/screens/campaigns/campaigns_screen.dart lib/core/app_version.dart pubspec.yaml web/rpg_service_worker.js RELEASE_NOTES_1.3.24.md
          git commit -m "feat: polish scene controls and card spacing v1.3.24"
          git push origin HEAD:v1-3-24-ui-polish
