name: Apply RPG Sheet v1.3.18

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v1318.yml'

permissions:
  contents: write

jobs:
  apply-v1318:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.3.18 source changes
        run: python3 scripts/apply_tab_style_v1318.py

      - name: Commit v1.3.18
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib pubspec.yaml web README.md RELEASE_NOTES_1.3.18.md
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "feat: unified navigation tabs v1.3.18"
          git push origin HEAD:main
