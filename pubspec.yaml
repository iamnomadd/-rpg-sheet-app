name: rpg_sheet_app
description: Aplicativo de fichas de RPG modular e personalizável.
publish_to: "none"
version: 1.3.69+169
environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: 6.1.2
  shared_preferences: 2.5.3
  uuid: 4.5.1
  image_picker: 1.1.2
  file_picker: 10.3.6
  share_plus: 10.1.4
  app_links: 6.4.1
  http: 1.2.2
  supabase: 2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  assets:
    - assets/character2d/
    - assets/icons/action/
    - assets/icons/tabs/
    - assets/icons/resources/
    - assets/icons/sections/
  uses-material-design: true
